# kcwatch feed workflow

# Watches the boards listed below, runs the kernel-delta pipeline
# (poll ipsw.me -> ranged-fetch kernelcache -> XPF resolve -> diff),
# and commits any new reports + the updated feed index.

# kcwatch.py reads KCWATCH_DIR for state/reports; the sync step copies
# the results into state/ and reports/ for the commit.

name: kcwatch

on:
  schedule:
    - cron: '0 6 * * *'        # once a day, polite to ipsw.me and the CDN
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 liblzfse1

      - name: Restore watcher state
        run: |
          mkdir -p .kcwatch/t8030
          cp state/t8030/state.json .kcwatch/t8030/state.json 2>/dev/null || true
          cp state/t8030/*.txt .kcwatch/t8030/ 2>/dev/null || true

      - name: Watch boards
        env:
          KCWATCH_DIR: .kcwatch
        run: |
          python3 scripts/kcwatch.py poll --board t8030
          # python3 scripts/kcwatch.py poll --board t8103
          # python3 scripts/kcwatch.py poll --board t8110

      - name: Sync feed
        run: |
          mkdir -p reports state/t8030
          cp .kcwatch/t8030/reports/kernel-deltas.md kernel-deltas.md 2>/dev/null || true
          cp .kcwatch/t8030/reports/*.md reports/ 2>/dev/null || true
          cp .kcwatch/t8030/state.json state/t8030/state.json 2>/dev/null || true
          cp .kcwatch/t8030/*.txt state/t8030/ 2>/dev/null || true

      - name: Commit feed update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "kcwatch: feed update"
          file_pattern: "kernel-deltas.md reports/ state/"

      - name: Notify on new build
        if: ${{ steps.watch.outputs.new_build == 'yes' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'new kernel build detected',
              body: 'Check the kcwatch workflow log for the report.'
            })
