# kcwatch feed workflow

# Watches the boards listed below, runs the kernel-delta pipeline
# (poll ipsw.me -> ranged-fetch kernelcache -> XPF resolve -> diff),
# renders the cumulative index + Atom feed, and commits the result.

# kcwatch.py reads KCWATCH_DIR for state/reports; the sync step copies
# state + report files into state/ and reports/ for the commit. The
# index and atom commands write kernel-deltas.md / atom.xml at the
# repo root (CWD), which is exactly what gets committed.

name: kcwatch

# the auto-commit step pushes with GITHUB_TOKEN - needs write access
permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * *'        # once a day, polite to ipsw.me and the CDN
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 liblzfse1 libblocksruntime0

      - name: Restore watcher state
        run: |
          for b in t8030 t8110; do
            mkdir -p .kcwatch/$b/reports
            cp state/$b/state.json .kcwatch/$b/state.json 2>/dev/null || true
            cp state/$b/*.txt .kcwatch/$b/ 2>/dev/null || true
            cp reports/$b-*.md .kcwatch/$b/reports/ 2>/dev/null || true
          done

      - name: Watch boards
        env:
          KCWATCH_DIR: .kcwatch
        run: |
          ./kernel-deltas poll --board t8030
          ./kernel-deltas poll --board t8110

      - name: Render feed
        env:
          KCWATCH_DIR: .kcwatch
        run: |
          ./kernel-deltas index
          ./kernel-deltas atom

      - name: Sync state + reports
        run: |
          mkdir -p reports state/t8030 state/t8110
          for b in t8030 t8110; do
            cp .kcwatch/$b/reports/*.md reports/ 2>/dev/null || true
            cp .kcwatch/$b/state.json state/$b/state.json 2>/dev/null || true
            cp .kcwatch/$b/*.txt state/$b/ 2>/dev/null || true
          done

      - name: Commit feed update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "kcwatch: feed update"
          file_pattern: "kernel-deltas.md atom.xml reports/ state/"
